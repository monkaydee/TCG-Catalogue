name: Play Store bundle

# Builds the app bundle for Google Play with the Pro paywall on (docs/PRO-TIER.md).
# Started by hand; it never publishes anything. Download the .aab from the run and upload it in the Play Console.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code for Play (a whole number, higher than the last upload, e.g. 300)"
        required: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64" || { echo "Secret UPLOAD_KEYSTORE_BASE64 is not set (docs/PRO-TIER.md)"; exit 1; }
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build bundle
        run: ./gradlew --no-daemon bundleRelease lintRelease
        env:
          PRO_PAYWALL: "true"
          VERSION_CODE: ${{ inputs.version_code }}
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          PRICE_SERVER_URL: ${{ secrets.PRICE_SERVER_URL }}
          PRICE_SERVER_KEY: ${{ secrets.APP_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: cardnavo-play-${{ inputs.version_code }}
          path: app/build/outputs/bundle/release/app-release.aab

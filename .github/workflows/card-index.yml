name: Card index

# Builds the card-number index for the games without a dedicated API (Dragon Ball,
# Union Arena, Weiss Schwarz, Naruto) from TCGCSV and publishes it on the `data`
# branch, where the app downloads it from. Runs daily after TCGCSV's update.
on:
  schedule:
    - cron: "43 21 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/build_card_index.py
      - scripts/build_name_index.py
      - scripts/build_sealed_index.py
      - .github/workflows/card-index.yml

permissions:
  contents: write

concurrency:
  group: card-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build index
        run: python scripts/build_card_index.py out

      - name: Build Pokémon name index (all languages)
        run: python scripts/build_name_index.py out

      - name: Build regional sealed catalogue (German and Japanese search)
        run: python scripts/build_sealed_index.py out

      # A single orphan commit, replaced every day, so the branch never grows.
      - name: Publish to the data branch
        working-directory: out
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Card index $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

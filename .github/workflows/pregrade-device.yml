name: Pre-grade camera smoke
on:
  push:
    paths: ["app/src/main/**", "app/src/androidTest/**", ".github/workflows/pregrade-device.yml"]
  pull_request:
    paths: ["app/src/main/**", "app/src/androidTest/**", ".github/workflows/pregrade-device.yml"]
  workflow_dispatch:
jobs:
  camera:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.monkaydee.tcgcatalogue.PregradeCameraSmokeTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-smoke-api-${{ matrix.api }}-${{ github.event_name }}
          path: app/build/reports/androidTests/connected/
